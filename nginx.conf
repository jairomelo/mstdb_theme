    # Preserve the client-facing scheme through the proxy chain: host nginx
    # terminates TLS and sends X-Forwarded-Proto: https, but $scheme here is
    # plain http. Passing $scheme through would make Django build http://
    # media URLs (mixed-content block). Fall back to $scheme when direct.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache hashed assets aggressively
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static media/icons
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Static and user-uploaded media
    # First try to serve from the local filesystem (for static assets like rutas_project*.webp).
    # If the file doesn't exist locally, proxy to the Django backend (for user-uploaded files
    # like lecciones/2026/07/file.jpg that are stored in MEDIA_ROOT on the backend).
    location /media/ {
        try_files $uri @media_backend;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Backend proxy for media files not found locally
    location @media_backend {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy API requests to the Django backend
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Proxy Django admin
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Serve Django static files (admin CSS/JS)
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
    }

    # The SPA document must always revalidate: it is the only entry point that
    # knows the current hashed asset names. Caching it (heuristically or long)
    # pins a client to a stale bundle after a deploy. Hashed /_app/immutable/*
    # assets below stay immutable for a year, so revalidation is cheap.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any route not matched above serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
